<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16242B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Course à deux">
<meta name="robots" content="noindex">
<title>Course à deux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #16242B;
    --paper: #ECEFE8;
    --card: #FFFFFF;
    --line: #D6DCD1;
    --a: #1D6F6A;
    --b: #B8456B;
    --signal: #D99400;
    --muted: #6E7C74;
    --bad: #A33B3B;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink);
    line-height: 1.45;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .root { max-width: 540px; margin: 0 auto; padding: 14px 14px 44px; }
  .num { font-family: 'Barlow Condensed', 'Inter', sans-serif; font-weight: 700; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }

  /* scoreboard */
  .board { background: var(--ink); border-radius: 14px; padding: 16px 16px 14px; color: #fff; }
  .board-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
  .eyebrow { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,0.55); font-weight: 600; }
  .cagnotte { text-align: right; }
  .cagnotte .num { font-size: 30px; color: var(--signal); line-height: 1; }
  .scores { display: flex; gap: 10px; }
  .score { flex: 1; background: rgba(255,255,255,0.07); border-radius: 10px; padding: 10px 12px; border-left: 3px solid var(--a); min-width: 0; }
  .score.b { border-left-color: var(--b); }
  .score-name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score .num { font-size: 38px; line-height: 1; }
  .score-sub { font-size: 10px; color: rgba(255,255,255,0.45); letter-spacing: 0.06em; text-transform: uppercase; }
  .bump { animation: bump 0.4s ease; }
  @keyframes bump { 0% { transform: scale(1); } 35% { transform: scale(1.14); } 100% { transform: scale(1); } }
  .syncdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #4FA88A; margin-left: 6px; vertical-align: middle; }
  .syncdot.off { background: #C77; }

  /* day nav */
  .daynav { display: flex; align-items: center; justify-content: space-between; margin: 18px 2px 8px; }
  .daynav h2 { margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; text-transform: uppercase; }
  .daytype { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
  .arrow { background: none; border: 1px solid var(--line); border-radius: 8px; width: 36px; height: 36px; font-size: 16px; color: var(--ink); cursor: pointer; }
  .arrow:disabled { opacity: 0.3; }

  /* person card */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .who { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .whoname { font-weight: 600; font-size: 15px; border: none; background: none; padding: 0; color: var(--ink); font-family: inherit; width: 100%; min-width: 0; }
  .whoname:focus { outline: 2px solid var(--signal); outline-offset: 3px; border-radius: 3px; }
  .daypts { font-size: 22px; flex: none; }

  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 11px 2px 9px; font-family: inherit; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .btn .ic { font-size: 15px; line-height: 1; }
  .btn:active { transform: scale(0.96); }
  .btn.on { color: #fff; border-color: transparent; }
  .btn.on.fait { background: var(--a); }
  .btn.on.fait.pb { background: var(--b); }
  .btn.on.joker { background: var(--signal); }
  .btn.on.rate { background: var(--bad); }
  .btn.on.off { background: var(--muted); }
  .btn:focus-visible, .chip:focus-visible, .arrow:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  .bonus { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { border: 1px dashed var(--line); background: #fff; border-radius: 20px; padding: 7px 12px; font-family: inherit; font-size: 11.5px; font-weight: 500; color: var(--muted); cursor: pointer; }
  .chip.on { background: #FDF3DC; border: 1px solid var(--signal); color: #8A5E00; font-weight: 600; }
  .rest { font-size: 13px; color: var(--muted); padding: 4px 2px; }

  /* week */
  .sec-title { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 20px 2px 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .week { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 8px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .daycol { text-align: center; }
  .daycol.today { background: #FDF3DC; border-radius: 8px; padding: 3px 0 5px; }
  .daycol.today .dlabel { color: var(--ink); font-weight: 700; }
  .dlabel { font-size: 10px; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; font-weight: 600; }
  .dtype { font-size: 8px; color: #A9B3AC; text-transform: uppercase; margin-bottom: 5px; }
  .marks { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .mark { width: 16px; height: 5px; border-radius: 2px; background: #E4E8E0; }
  .mark.fait-a { background: var(--a); }
  .mark.fait-b { background: var(--b); }
  .mark.joker { background: var(--signal); }
  .mark.rate { background: var(--bad); }
  .mark.off { background: #B9C2BB; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mini { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; }
  .mini-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .mini .num { font-size: 24px; line-height: 1.1; }
  .jokers { display: flex; gap: 4px; margin-top: 5px; }
  .jk { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--signal); }
  .jk.used { background: transparent; border-color: var(--line); }
  .jk.left { background: var(--signal); }

  .challenge input[type=text] { width: 100%; border: none; border-bottom: 1px dashed var(--line); font-family: inherit; font-size: 13px; padding: 6px 0; background: none; color: var(--ink); margin: 4px 0 9px; }
  .challenge input:focus { outline: none; border-bottom-color: var(--signal); }

  .sched { padding: 4px 6px; }
  .schedrow {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 12px 6px; font-family: inherit; cursor: pointer; color: var(--ink);
  }
  .sched .schedrow:last-child { border-bottom: none; }
  .schedday { font-size: 14px; font-weight: 500; }
  .schedtype {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 20px; border: 1px solid var(--line); color: var(--muted);
  }
  .schedrow.course .schedtype { background: var(--a); border-color: var(--a); color: #fff; }
  .schedrow.recup .schedtype { background: #E7F0EC; border-color: #BBD3C8; color: #2F5E4E; }
  .schedrow.repos .schedtype { background: none; }
  .schedrow:active { background: #F5F7F3; }
  .schedrow:focus-visible { outline: 2px solid var(--signal); outline-offset: -2px; }

  #diag {
    white-space: pre-wrap; word-break: break-word; margin: 10px 0 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; line-height: 1.5; color: var(--ink);
  }
  #diag:empty { display: none; }

  .note { font-size: 11.5px; color: var(--muted); margin-top: 16px; padding: 0 2px; line-height: 1.5; }
  .reset { background: none; border: none; color: var(--muted); font-family: inherit; font-size: 11.5px; text-decoration: underline; cursor: pointer; padding: 0; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; z-index: 50; opacity: 0; pointer-events: none; transition: opacity 0.25s; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 40px 0; color: var(--muted); font-size: 14px; }

  .setup { background: #FDF3DC; border: 1px solid var(--signal); border-radius: 12px; padding: 16px; font-size: 13.5px; line-height: 1.6; }
  .setup h3 { margin: 0 0 8px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; text-transform: uppercase; }
  .setup code { background: #fff; padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="root"><div id="app"><div class="loading">Chargement du tableau…</div></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   CONFIGURATION — remplace les trois valeurs ci-dessous, puis sauvegarde.
   Voir README.md pour la marche à suivre.
   ===================================================================== */

var SUPABASE_URL = "https://pjxfiplcgaeborwdqimc.supabase.co";   // ex. https://abcdxyz.supabase.co
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBqeGZpcGxjZ2FlYm9yd2RxaW1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNjQ2NzMsImV4cCI6MjEwMTk0MDY3M30.3I7HrYKPcSfFYdVytQ7vtNkyd9pUui8Jc9Gua5tNdG0";       // la clé "anon public"
var ROW_ID       = "adelie-alex-64";    // ex. "adelie-alex-7fq2" (inventez-le)

/* ===================================================================== */

(function () {
  "use strict";

  var TABLE = "tableau";
  var CONFIGURED = SUPABASE_URL.indexOf("http") === 0 && SUPABASE_KEY.length > 20;

  // Calendrier par défaut, modifiable dans la page (index 0 = dimanche)
  var DEFAULT_SCHEDULE = ["repos", "course", "recup", "course", "recup", "course", "recup"];
  var CYCLE = ["course", "recup", "repos"];
  var DLABEL = ["D", "L", "M", "M", "J", "V", "S"];
  var DFULL = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
  var TYPESHORT = { course: "course", recup: "récup", repos: "repos" };
  var TYPELONG = { course: "Jour de course", recup: "Récup active", repos: "Repos" };

  var BONUSES = [
    { id: "push",    pts: 5, label: "Coup de pouce +5" },
    { id: "group",   pts: 3, label: "Ensemble +3" },
    { id: "morning", pts: 2, label: "Avant midi +2" },
    { id: "weather", pts: 5, label: "Météo pourrie +5" }
  ];

  var PTS_DONE = 10, PTS_MISS = -8, PTS_WEEK = 15, PTS_CHALLENGE = 10;
  var JOKERS_PER_MONTH = 2;
  var CACHE = "coursedeux-cache";

  var state = null;
  var viewDate = new Date();
  var lastTotals = { a: null, b: null };
  var online = true;
  var busy = false;

  /* ---------------- stockage ---------------- */

  function blank() {
    return {
      names: { a: "Adélie", b: "Alexandre" },
      days: {},
      challenge: {},
      schedule: DEFAULT_SCHEDULE.slice()
    };
  }

  function normalise(s) {
    if (!s || typeof s !== "object") return blank();
    if (!s.names) s.names = { a: "Adélie", b: "Alexandre" };
    if (!s.days) s.days = {};
    if (!s.challenge) s.challenge = {};
    if (!Array.isArray(s.schedule) || s.schedule.length !== 7) s.schedule = DEFAULT_SCHEDULE.slice();
    for (var i = 0; i < 7; i++) {
      if (CYCLE.indexOf(s.schedule[i]) === -1) s.schedule[i] = DEFAULT_SCHEDULE[i];
    }
    return s;
  }

  // type d'un jour de la semaine (0 = dimanche)
  function typeOf(s, wd) { return s.schedule[wd]; }
  function activeDays(s) {
    var n = 0;
    for (var i = 0; i < 7; i++) if (s.schedule[i] !== "repos") n++;
    return n;
  }

  function cacheRead() {
    try {
      var raw = localStorage.getItem(CACHE);
      return raw ? normalise(JSON.parse(raw)) : null;
    } catch (e) { return null; }
  }
  function cacheWrite(s) {
    try { localStorage.setItem(CACHE, JSON.stringify(s)); } catch (e) {}
  }

  function headers(extra) {
    var h = {
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json"
    };
    if (extra) Object.keys(extra).forEach(function (k) { h[k] = extra[k]; });
    return h;
  }

  var lastError = "";

  function checkResponse(r) {
    if (r.ok) return r;
    return r.text().then(function (t) {
      throw new Error("HTTP " + r.status + (t ? " — " + t.slice(0, 200) : ""));
    });
  }

  function load() {
    if (!CONFIGURED) return Promise.resolve(cacheRead() || blank());
    var url = SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/" + TABLE +
              "?id=eq." + encodeURIComponent(ROW_ID) + "&select=data";
    return fetch(url, { headers: headers() })
      .then(checkResponse)
      .then(function (r) { return r.json(); })
      .then(function (rows) {
        setOnline(true);
        lastError = "";
        if (!rows || !rows.length) return cacheRead() || blank();
        return normalise(rows[0].data);
      })
      .catch(function (e) {
        setOnline(false);
        lastError = e.message || String(e);
        return cacheRead() || blank();
      });
  }

  function save(s) {
    cacheWrite(s);
    if (!CONFIGURED) return Promise.resolve();
    var url = SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/" + TABLE;
    return fetch(url, {
      method: "POST",
      headers: headers({ "Prefer": "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify({ id: ROW_ID, data: s, updated_at: new Date().toISOString() })
    }).then(checkResponse).then(function () {
      setOnline(true);
      lastError = "";
    }).catch(function (e) {
      setOnline(false);
      lastError = e.message || String(e);
      toast("Pas de réseau. Enregistré sur ce téléphone, envoyé plus tard.");
    });
  }

  /* ---------------- diagnostic ---------------- */

  function hint(status, body) {
    if (status === 404) {
      return "La table est introuvable. Le bloc SQL n'a probablement pas été exécuté, " +
             "ou la table ne s'appelle pas exactement « tableau ». " +
             "Retourne dans SQL Editor et relance le bloc.";
    }
    if (status === 401 || status === 403) {
      if (/row-level security|RLS|policy/i.test(body)) {
        return "La table existe mais l'autorisation manque. C'est la partie « create policy » du bloc SQL " +
               "qui n'est pas passée. Relance uniquement cette partie dans SQL Editor.";
      }
      return "La clé est refusée. Vérifie que tu as bien copié la clé publique en entier, sans espace " +
             "avant ou après, et que ce n'est pas la clé secrète.";
    }
    if (status >= 500) return "Supabase répond mal. Vérifie sur ton tableau de bord que le projet n'est pas en pause.";
    if (status === 200 || status === 206) return "La connexion fonctionne. Si la synchro coince encore, recharge la page sur les deux téléphones.";
    return "Envoie-moi ce message tel quel, je regarde.";
  }

  function diagnose() {
    var out = document.getElementById("diag");
    if (!out) return;
    out.textContent = "Test en cours…";

    if (!CONFIGURED) {
      out.textContent = "Les trois valeurs en haut du fichier ne sont pas remplies.";
      return;
    }
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(SUPABASE_URL.trim())) {
      out.textContent = "L'adresse du projet a une forme inattendue :\n" + SUPABASE_URL +
        "\n\nElle doit ressembler exactement à https://abcdxyz.supabase.co, sans rien après le .co";
      return;
    }

    var url = SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/" + TABLE + "?select=id&limit=1";
    fetch(url, { headers: headers() })
      .then(function (r) {
        return r.text().then(function (t) { return { status: r.status, body: t }; });
      })
      .then(function (res) {
        out.textContent = "Code " + res.status + "\n" +
          (res.body ? res.body.slice(0, 300) + "\n\n" : "\n") + hint(res.status, res.body);
      })
      .catch(function (e) {
        out.textContent = "Aucune réponse du serveur.\n" + (e.message || e) +
          "\n\nSoit l'adresse du projet est fausse, soit le téléphone n'a pas de connexion. " +
          "Ouvre " + SUPABASE_URL + " dans un onglet : tu dois obtenir une page, pas une erreur.";
      });
  }

  function setOnline(v) {
    if (online === v) return;
    online = v;
    var d = document.getElementById("syncdot");
    if (d) d.className = "syncdot" + (v ? "" : " off");
  }

  // lit la version la plus récente, applique, réécrit
  function mutate(fn) {
    if (busy) return;
    busy = true;
    load().then(function (latest) {
      fn(latest);
      state = latest;
      render();
      return save(latest);
    }).then(function () { busy = false; })
      .catch(function () { busy = false; });
  }

  /* ---------------- dates ---------------- */

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function key(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function monthKey(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1); }
  function monthOf(k) { return k.slice(0, 7); }
  function parseKey(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function sameDay(a, b) { return key(a) === key(b); }
  function addDays(d, n) { var x = new Date(d.getTime()); x.setDate(x.getDate() + n); return x; }
  function mondayOf(d) {
    var x = new Date(d.getTime()), wd = x.getDay();
    return addDays(x, wd === 0 ? -6 : 1 - wd);
  }
  function weekKeyOf(d) { return key(mondayOf(d)); }

  var MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  var JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

  function prettyDate(d) {
    var t = new Date();
    if (sameDay(d, t)) return "Aujourd'hui";
    if (sameDay(d, addDays(t, -1))) return "Hier";
    return JOURS[d.getDay()] + " " + d.getDate() + " " + MOIS[d.getMonth()];
  }

  /* ---------------- calculs ---------------- */

  function entry(s, k, who) {
    var day = s.days[k];
    if (!day || !day[who]) return { status: null, bonus: {} };
    return { status: day[who].status || null, bonus: day[who].bonus || {} };
  }
  function setEntry(s, k, who, e) {
    if (!s.days[k]) s.days[k] = {};
    s.days[k][who] = e;
  }
  function dayPoints(e) {
    if (e.status === "fait") {
      var p = PTS_DONE;
      for (var i = 0; i < BONUSES.length; i++) if (e.bonus[BONUSES[i].id]) p += BONUSES[i].pts;
      return p;
    }
    if (e.status === "rate") return PTS_MISS;
    return 0;
  }
  function total(s, who) {
    var sum = 0, weeks = {}, target = activeDays(s);
    Object.keys(s.days).forEach(function (k) {
      var e = entry(s, k, who);
      sum += dayPoints(e);
      var d = parseKey(k);
      if (typeOf(s, d.getDay()) !== "repos") {
        var wk = weekKeyOf(d);
        if (!weeks[wk]) weeks[wk] = 0;
        if (e.status === "fait") weeks[wk]++;
      }
    });
    if (target > 0) {
      Object.keys(weeks).forEach(function (wk) { if (weeks[wk] >= target) sum += PTS_WEEK; });
    }
    Object.keys(s.challenge).forEach(function (mk) {
      if (s.challenge[mk] && s.challenge[mk][who]) sum += PTS_CHALLENGE;
    });
    return sum;
  }
  function monthPoints(s, who, mk) {
    var sum = 0;
    Object.keys(s.days).forEach(function (k) {
      if (monthOf(k) === mk) sum += dayPoints(entry(s, k, who));
    });
    if (s.challenge[mk] && s.challenge[mk][who]) sum += PTS_CHALLENGE;
    return sum;
  }
  function jokersUsed(s, who, mk) {
    var n = 0;
    Object.keys(s.days).forEach(function (k) {
      if (monthOf(k) === mk && entry(s, k, who).status === "joker") n++;
    });
    return n;
  }
  function weekDone(s, who, d) {
    var mon = mondayOf(d), n = 0;
    for (var i = 0; i < 7; i++) {
      var day = addDays(mon, i);
      if (typeOf(s, day.getDay()) === "repos") continue;
      if (entry(s, key(day), who).status === "fait") n++;
    }
    return n;
  }

  /* ---------------- actions ---------------- */

  function pick(who, status) {
    var k = key(viewDate);
    mutate(function (s) {
      var cur = entry(s, k, who);
      if (cur.status === status) { setEntry(s, k, who, { status: null, bonus: {} }); return; }
      if (status === "joker" && jokersUsed(s, who, monthOf(k)) >= JOKERS_PER_MONTH) {
        toast("Plus de joker ce mois-ci. Malade ou blessé ? Prends « dispense ».");
        return;
      }
      setEntry(s, k, who, { status: status, bonus: status === "fait" ? cur.bonus : {} });
      if (status === "fait" && weekDone(s, who, viewDate) >= 6) toast("Semaine pleine ! +" + PTS_WEEK + " points");
    });
  }

  function toggleBonus(who, bid) {
    var k = key(viewDate);
    mutate(function (s) {
      var cur = entry(s, k, who);
      if (cur.status !== "fait") return;
      var b = {};
      Object.keys(cur.bonus).forEach(function (x) { b[x] = cur.bonus[x]; });
      b[bid] = !b[bid];
      setEntry(s, k, who, { status: "fait", bonus: b });
    });
  }

  function toggleChallenge(who) {
    var mk = monthKey(viewDate);
    mutate(function (s) {
      if (!s.challenge[mk]) s.challenge[mk] = { text: "", a: false, b: false };
      s.challenge[mk][who] = !s.challenge[mk][who];
    });
  }
  function setChallengeText(txt) {
    var mk = monthKey(viewDate);
    mutate(function (s) {
      if (!s.challenge[mk]) s.challenge[mk] = { text: "", a: false, b: false };
      s.challenge[mk].text = txt;
    });
  }
  function cycleDay(wd) {
    mutate(function (s) {
      var i = CYCLE.indexOf(s.schedule[wd]);
      var next = CYCLE[(i + 1) % CYCLE.length];
      if (next === "repos" && activeDays(s) <= 1) {
        toast("Il faut garder au moins un jour actif dans la semaine.");
        return;
      }
      s.schedule[wd] = next;
    });
  }

  function setName(who, name) {
    mutate(function (s) { s.names[who] = name.slice(0, 18) || (who === "a" ? "Joueuse A" : "Joueur B"); });
  }
  function resetAll() {
    if (!window.confirm("Effacer tout l'historique et remettre les compteurs à zéro ?")) return;
    mutate(function (s) { s.days = {}; s.challenge = {}; });
    toast("Tableau remis à zéro.");
  }

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 2800);
  }

  /* ---------------- rendu ---------------- */

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function personCard(who) {
    var k = key(viewDate), e = entry(state, k, who), type = typeOf(state, viewDate.getDay());
    var col = who === "a" ? "var(--a)" : "var(--b)";
    var pb = who === "b" ? " pb" : "";
    var pts = dayPoints(e);
    var txt = pts > 0 ? "+" + pts : (pts < 0 ? "" + pts : "—");
    var pcol = pts > 0 ? col : (pts < 0 ? "var(--bad)" : "#C4CCC5");

    var h = '<div class="card"><div class="card-head"><div class="who">';
    h += '<span class="dot" style="background:' + col + '"></span>';
    h += '<input class="whoname" data-name="' + who + '" value="' + esc(state.names[who]) + '" aria-label="Nom">';
    h += '</div><span class="num daypts" style="color:' + pcol + '">' + txt + '</span></div>';

    if (type === "repos") {
      return h + '<div class="rest">Jour de repos. Rien à cocher, c\'est le programme.</div></div>';
    }

    var opts = [
      { s: "fait", ic: "✓", l: type === "course" ? "Couru" : "Bougé", cls: "fait" + pb },
      { s: "joker", ic: "★", l: "Joker", cls: "joker" },
      { s: "rate", ic: "✕", l: "Raté", cls: "rate" },
      { s: "dispense", ic: "✚", l: "Dispense", cls: "off" }
    ];
    h += '<div class="actions">';
    opts.forEach(function (o) {
      h += '<button class="btn' + (e.status === o.s ? " on " + o.cls : "") + '" data-act="' + who + ':' + o.s + '">' +
           '<span class="ic">' + o.ic + '</span>' + o.l + '</button>';
    });
    h += '</div>';

    if (e.status === "fait") {
      h += '<div class="bonus">';
      BONUSES.forEach(function (b) {
        h += '<button class="chip' + (e.bonus[b.id] ? " on" : "") + '" data-bonus="' + who + ':' + b.id + '">' + b.label + '</button>';
      });
      h += '</div>';
    }
    return h + '</div>';
  }

  function weekStrip() {
    var mon = mondayOf(viewDate), today = new Date(), h = '<div class="week">';
    for (var i = 0; i < 7; i++) {
      var d = addDays(mon, i), k = key(d), t = typeOf(state, d.getDay());
      h += '<div class="daycol' + (sameDay(d, today) ? " today" : "") + '">';
      h += '<div class="dlabel">' + DLABEL[d.getDay()] + '</div>';
      h += '<div class="dtype">' + (t === "repos" ? "—" : TYPESHORT[t]) + '</div><div class="marks">';
      ["a", "b"].forEach(function (who) {
        var st = entry(state, k, who).status, cls = "";
        if (st === "fait") cls = who === "a" ? "fait-a" : "fait-b";
        else if (st === "joker") cls = "joker";
        else if (st === "rate") cls = "rate";
        else if (st === "dispense") cls = "off";
        h += '<div class="mark ' + cls + '"></div>';
      });
      h += '</div></div>';
    }
    return h + '</div>';
  }

  function jokerRow(who, mk) {
    var used = jokersUsed(state, who, mk), h = '<div class="jokers">';
    for (var i = 0; i < JOKERS_PER_MONTH; i++) {
      h += '<div class="jk ' + (i < JOKERS_PER_MONTH - used ? "left" : "used") + '"></div>';
    }
    return h + '</div>';
  }

  function render() {
    var app = document.getElementById("app");

    if (!CONFIGURED) {
      app.innerHTML = '<div class="setup"><h3>Il reste une étape</h3>' +
        '<p>Ouvre <code>index.html</code> et remplace les trois valeurs en haut du script : ' +
        '<code>SUPABASE_URL</code>, <code>SUPABASE_KEY</code> et <code>ROW_ID</code>. ' +
        'Les instructions sont dans le fichier <code>README.md</code>.</p>' +
        '<p>En attendant, le tableau fonctionne, mais uniquement sur ce téléphone.</p></div>';
      return;
    }

    var ta = total(state, "a"), tb = total(state, "b");
    var mk = monthKey(viewDate);
    var ch = state.challenge[mk] || { text: "", a: false, b: false };
    var isFuture = key(viewDate) >= key(addDays(new Date(), 1));
    var h = "";

    h += '<div class="board"><div class="board-top"><div>';
    h += '<div class="eyebrow">Course à deux<span class="syncdot' + (online ? "" : " off") + '" id="syncdot"></span></div>';
    h += '<div style="font-size:12px;color:rgba(255,255,255,0.5)">' + activeDays(state) + ' jours sur 7, depuis le début</div></div>';
    h += '<div class="cagnotte"><div class="eyebrow">Cagnotte</div><div class="num">' +
         ((ta + tb) * 0.1).toFixed(2).replace(".", ",") + ' €</div></div></div><div class="scores">';
    h += '<div class="score"><div class="score-name">' + esc(state.names.a) + '</div><div class="num" id="ta">' + ta + '</div><div class="score-sub">points</div></div>';
    h += '<div class="score b"><div class="score-name">' + esc(state.names.b) + '</div><div class="num" id="tb">' + tb + '</div><div class="score-sub">points</div></div>';
    h += '</div></div>';

    h += '<div class="daynav"><button class="arrow" data-nav="-1" aria-label="Jour précédent">‹</button>';
    h += '<div style="text-align:center"><h2>' + prettyDate(viewDate) + '</h2><div class="daytype">' +
         TYPELONG[typeOf(state, viewDate.getDay())] +
         '</div></div>';
    h += '<button class="arrow" data-nav="1" aria-label="Jour suivant"' + (isFuture ? " disabled" : "") + '>›</button></div>';

    h += personCard("a") + personCard("b");

    var tgt = activeDays(state);
    h += '<div class="sec-title"><span>La semaine</span><span>' + weekDone(state, "a", viewDate) + '/' + tgt +
         ' · ' + weekDone(state, "b", viewDate) + '/' + tgt + '</span></div>';
    h += weekStrip();

    h += '<div class="sec-title">Ce mois-ci</div><div class="grid2">';
    ["a", "b"].forEach(function (who) {
      h += '<div class="mini"><div class="mini-label">' + esc(state.names[who]) + '</div>';
      h += '<div class="num" style="color:' + (who === "a" ? "var(--a)" : "var(--b)") + '">' + monthPoints(state, who, mk) + '</div>';
      h += '<div class="mini-label" style="margin-top:6px">Jokers restants</div>' + jokerRow(who, mk) + '</div>';
    });
    h += '</div>';

    h += '<div class="sec-title">Défi du mois · +' + PTS_CHALLENGE + '</div><div class="mini challenge">';
    h += '<input type="text" id="chtext" placeholder="Écrivez votre défi du mois ici" value="' + esc(ch.text || "") + '">';
    h += '<div style="display:flex;gap:6px">';
    ["a", "b"].forEach(function (who) {
      h += '<button class="chip' + (ch[who] ? " on" : "") + '" data-ch="' + who + '" style="flex:1">' + (ch[who] ? "✓ " : "") + esc(state.names[who]) + '</button>';
    });
    h += '</div></div>';

    h += '<div class="sec-title"><span>Vos jours</span><span style="text-transform:none;letter-spacing:0">Tapez pour changer</span></div>';
    h += '<div class="mini sched">';
    [1, 2, 3, 4, 5, 6, 0].forEach(function (wd) {
      var t = typeOf(state, wd);
      h += '<button class="schedrow ' + t + '" data-sched="' + wd + '">' +
           '<span class="schedday">' + DFULL[wd] + '</span>' +
           '<span class="schedtype">' + TYPELONG[t] + '</span></button>';
    });
    h += '</div>';
    h += '<div class="note">Chaque tap fait défiler course, récup active, repos. ' +
         'Le bonus de semaine pleine s\'ajuste tout seul : il vaut ' + PTS_WEEK + ' points quand vous faites vos ' +
         activeDays(state) + ' jours. Le calendrier est commun aux deux téléphones.</div>';

    h += '<div class="sec-title"><span>Connexion</span><span style="text-transform:none;letter-spacing:0;color:' +
         (online ? "#3E8A6E" : "var(--bad)") + '">' + (online ? "synchronisée" : "coupée") + '</span></div>';
    h += '<div class="mini">';
    h += '<button class="chip" id="diagbtn" style="width:100%">Tester la connexion</button>';
    h += '<pre id="diag">' + (lastError ? esc("Dernière erreur : " + lastError) : "") + '</pre>';
    h += '</div>';

    h += '<div class="note">Barème : 10 points le jour fait, ' + PTS_MISS + ' le jour raté sans joker, 0 pour un joker ou une dispense. ' +
         '15 points pour une semaine pleine. 1 point = 10 centimes dans la cagnotte. ' +
         'Malade ou blessée : prenez « dispense », ça ne coûte rien et ça ne casse pas la série.</div>';
    h += '<div class="note"><button class="reset" id="reset">Tout remettre à zéro</button></div>';

    app.innerHTML = h;

    if (lastTotals.a !== null && ta !== lastTotals.a) bump("ta");
    if (lastTotals.b !== null && tb !== lastTotals.b) bump("tb");
    lastTotals.a = ta; lastTotals.b = tb;
  }

  function bump(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  /* ---------------- événements ---------------- */

  var app = document.getElementById("app");

  app.addEventListener("click", function (ev) {
    var t = ev.target.closest("button");
    if (!t) return;
    if (t.dataset.act) { var p = t.dataset.act.split(":"); pick(p[0], p[1]); }
    else if (t.dataset.bonus) { var q = t.dataset.bonus.split(":"); toggleBonus(q[0], q[1]); }
    else if (t.dataset.nav) { viewDate = addDays(viewDate, +t.dataset.nav); render(); }
    else if (t.dataset.ch) { toggleChallenge(t.dataset.ch); }
    else if (t.dataset.sched) { cycleDay(+t.dataset.sched); }
    else if (t.id === "diagbtn") { diagnose(); }
    else if (t.id === "reset") { resetAll(); }
  });

  app.addEventListener("change", function (ev) {
    var el = ev.target;
    if (el.dataset && el.dataset.name) setName(el.dataset.name, el.value.trim());
    else if (el.id === "chtext") setChallengeText(el.value.slice(0, 90));
  });

  /* ---------------- démarrage ---------------- */

  load().then(function (s) {
    state = normalise(s);
    render();
  });

  function refresh() {
    if (busy) return;
    if (document.activeElement && document.activeElement.tagName === "INPUT") return;
    if (document.hidden) return;
    load().then(function (s) {
      var fresh = JSON.stringify(normalise(s));
      if (state && fresh !== JSON.stringify(state)) { state = JSON.parse(fresh); render(); }
    });
  }

  setInterval(refresh, 6000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
